name: Node.js CI

on:
  push:
    branches: [ "main", "Trabalho-API", "Trabalho-K6" ]
  pull_request:
    branches: [ "main", "Trabalho-API", "Trabalho-K6" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: Install k6
      run: |
       curl -s https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
       echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
       sudo apt-get update
       sudo apt-get install k6

    - name: Install dependencies
      run: npm install

    - name: Start API Server
      run: npm start > /tmp/api.log 2>&1 &
      env:
        NODE_ENV: test

    - name: Wait for API to be ready
      run: |
        timeout 30 bash -c 'until curl -f http://localhost:3000/api-docs 2>/dev/null; do sleep 1; done'
      continue-on-error: true

    - name: Run tests
      run: npm run test-external

    - name: Generate K6 test emails
      run: npm run k6:generate-emails
      continue-on-error: true

    - name: Run K6 performance tests
      run: npm run k6:run
      continue-on-error: true

    - name: Generate K6 HTML report
      run: npm run k6:report
      continue-on-error: true

    - name: Upload K6 report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: k6-report
        path: reports/k6-report.html

    - name: Show API logs
      if: always()
      run: cat /tmp/api.log || echo "No API logs available"
