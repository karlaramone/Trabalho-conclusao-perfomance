name: Node.js CI

on:
  push:
    branches: [ "main", "Trabalho-API" ]
  pull_request:
    branches: [ "main", "Trabalho-API" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: Install dependencies
      run: npm install

    - name: Subir a API 
      run: npm start &

    - name: Check running processes
      run: ps aux | grep node

    - name: Esperar a API estar Funcionando
      run: sleep 5
      
    - name: Run tests
      run: npm run test-external
